version: '3.9'

services:
  backend:
    build: .
    container_name: hr_backend
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: always

  db:
    image: postgres:15
    container_name: hr_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hr_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: hr_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always

  celery_worker:
    build: .
    container_name: hr_celery
    command: celery -A src.infrastructure.tasks.worker.celery_app worker --loglevel=info
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    restart: always
    user: "1000:1000"

  mailpit:
    image: axllent/mailpit
    container_name: hr_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

  migrations:
    build: .
    container_name: hr_migrations
    working_dir: /app
    command: alembic -c src/infrastructure/database/alembic.ini upgrade head
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    restart: "no"

volumes:
  postgres_data:
  minio_data: